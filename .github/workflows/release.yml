name: Release

# Tag-driven, draft-only: pushing v1.2.3 builds the installers and stages them
# on a DRAFT release, so a tag push never ships to users on its own -- the
# maintainer reviews the bundles and presses Publish.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# tauri-action creates the draft release and uploads the bundles onto it.
permissions:
  contents: write

jobs:
  bundle:
    strategy:
      # A bundle that only breaks on one platform is the common case, and the
      # other platforms' artifacts are still worth having when it happens.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Same set the CI lint job installs: Tauri links against the system
      # webview on Linux, so without these the build fails at link time.
      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No tauriScript and no frontend build step: the action installs the
      # Tauri CLI itself, and frontendDist is this repo's static src/ dir.
      # bundle.targets is "all", so each runner produces its own formats --
      # deb/rpm/AppImage, msi/nsis, dmg/app.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Bundle filenames come from src-tauri/tauri.conf.json's `version`,
          # never from the tag -- bump it (and Cargo.toml's, which it must
          # agree with) in the commit you tag, or v0.2.0 ships 0.1.0 files.
          releaseBody: |
            Unsigned builds. macOS: right-click the app and choose Open on
            first launch, or Gatekeeper refuses it. Windows: SmartScreen will
            warn about an unrecognized publisher. Code signing is not set up
            for this project yet.
