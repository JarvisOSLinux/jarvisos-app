name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri links against the system webview; without these the build fails
      # at link time rather than in anything this repo controls.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: src-tauri
        run: cargo build --locked

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # bundle.icon files are committed and generated procedurally. If they
      # drift from the script, the icons a release ships stop matching the
      # thing that claims to produce them. Compares pixels rather than file
      # bytes: deflate output differs between zlib builds, so byte equality
      # fails across machines while nothing is actually wrong.
      - name: Icons match their generator
        run: python3 src-tauri/icons/generate_icon_source.py --check

  # A Windows build break has shipped here before (the time/cookie pin), and
  # ubuntu-only CI could not have caught it. macOS is here for the same
  # reason: nothing else compiles the cfg(target_os = "macos") paths, and it
  # is a platform the release workflow ships bundles for.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Whether a break is platform-specific is exactly what this job is for,
      # so one leg failing must not cancel the other.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --locked

      - name: Test
        working-directory: src-tauri
        run: cargo test
